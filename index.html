<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Prices</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14201b;--mute:#6b7a73;--line:#dde3e0;--up:#0d8a4e;--down:#c2352b;--acc:#16423a}
@media(prefers-color-scheme:dark){:root{--bg:#0d1412;--card:#142019;--ink:#e8efeb;--mute:#8fa097;--line:#25352d;--up:#3ecf8e;--down:#ff7a6e;--acc:#7fd6bd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}
h1{margin:0;font:600 26px Georgia,serif;letter-spacing:-.01em}
.sw{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sw button{border:0;background:var(--card);color:var(--mute);padding:8px 16px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sw button[aria-pressed=true]{background:var(--acc);color:var(--bg)}
.sw button:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.row{display:grid;grid-template-columns:1.3fr 1.2fr 1fr;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:10px}
.sym{font:600 18px Georgia,serif}.name{color:var(--mute);font-size:13px}
.price{font:600 22px ui-monospace,Consolas,monospace;text-align:right}
.chg{text-align:right;font-weight:600;font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}
.cat{margin:18px 0 8px;font:600 13px 'Segoe UI',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.meta{color:var(--mute);font-size:13px;margin-top:14px}
.err{color:var(--down)}
.layout{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;position:sticky;top:16px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.ph h2{margin:0;font:600 20px Georgia,serif}
.btn{border:0;background:var(--acc);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
input,select{width:100%;padding:9px 10px;margin-bottom:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#tot{padding:6px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.tv{font:600 26px ui-monospace,Consolas,monospace}
.ar{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ar[data-s]{cursor:pointer}.ar small,#tot small{color:var(--mute)}.ar .r{text-align:right}
.am{font-size:13px;color:var(--mute);margin:0 0 8px}p.am.err{color:var(--down)}
.del{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;padding:4px}
.del:hover{color:var(--down)}
@media(max-width:820px){.layout{grid-template-columns:1fr}.panel{position:static}}
.row{cursor:pointer}.row.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.row:focus-visible{outline:2px solid var(--acc)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.ch-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
#ct{font:600 20px Georgia,serif}#cp{font:600 18px ui-monospace,Consolas,monospace;margin-left:10px}#cc{font-size:14px;font-weight:600;margin-left:8px}
#cv{position:relative;min-height:260px}#cv svg{width:100%;height:auto;display:block;touch-action:none}
.tip{position:absolute;top:0;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;white-space:nowrap;transform:translateX(-50%)}
.cmsg{color:var(--mute);padding:90px 0;text-align:center;font-size:14px}
@media(max-width:520px){.row{grid-template-columns:1fr 1fr}.chg{grid-column:1/-1;text-align:left}}
</style>
</head>
<body>
<main>
<header>
  <h1>Live Prices</h1>
  <div class="sw" id="cur" role="group" aria-label="Currency">
    <button data-c="USD" aria-pressed="true">USD</button>
    <button data-c="EUR" aria-pressed="false">EUR</button>
    <button data-c="CZK" aria-pressed="false">CZK</button>
  </div>
</header>
<div class="layout">
<aside class="panel" aria-label="My assets">
  <div class="ph"><h2>My Assets</h2><button class="btn" id="addBtn" type="button">+ Add</button></div>
  <div id="auth"></div>
  <p class="am err" id="amsg" role="status"></p>
  <form id="addf" hidden>
    <input id="fn" list="syms" placeholder="Symbol or name (e.g. BTC)" autocomplete="off" required>
    <datalist id="syms"></datalist>
    <div class="two"><input id="fq" type="number" step="any" min="0" placeholder="Amount" required>
    <input id="fb" type="number" step="any" min="0" placeholder="Buy price / unit" required></div>
    <select id="fc" aria-label="Buy price currency"><option>USD</option><option>EUR</option><option>CZK</option></select>
    <div class="two"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" id="fcancel">Cancel</button></div>
  </form>
  <div id="tot"></div>
  <div id="alist"></div>
</aside>
<div class="right">
<section class="chart">
  <div class="ch-head"><div><span id="ct"></span><span id="cp"></span><span id="cc"></span></div>
  <div class="sw" id="rng" role="group" aria-label="Time range">
    <button data-r="1H" aria-pressed="false">1H</button><button data-r="1D" aria-pressed="true">1D</button>
    <button data-r="1W" aria-pressed="false">1W</button><button data-r="1M" aria-pressed="false">1M</button>
    <button data-r="1Y" aria-pressed="false">1Y</button>
  </div></div>
  <div id="cv"></div>
</section>
<input id="q" type="search" placeholder="Search assets…" aria-label="Search assets">
<div id="list"></div>
<p class="meta" id="meta">Loading…</p>
</div>
</div>
</main>
<script>
// ====== CONFIG: edit here ======
const FINNHUB_KEY = "PASTE_YOUR_FINNHUB_KEY_HERE"; // free at finnhub.io
const TWELVE_KEY = "PASTE_YOUR_TWELVEDATA_KEY_HERE"; // free at twelvedata.com (stock history)
const SB_URL = "https://tjtksizmiykbgfxssnag.supabase.co";      // e.g. https://abcd1234.supabase.co
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqdGtzaXptaXlrYmdmeHNzbmFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwODg5NzIsImV4cCI6MjEwODY2NDk3Mn0.uY4zgza03558OCQYav2AwJSn5rE2AFVvtwcRIM27DzY"; // the public "anon" key
const CRYPTO = [ // id = CoinGecko id
  {sym:"BTC", name:"Bitcoin",  id:"bitcoin",  bn:"BTCUSDT"},
  {sym:"ETH", name:"Ethereum", id:"ethereum", bn:"ETHUSDT"},
  {sym:"SOL", name:"Solana",   id:"solana",   bn:"SOLUSDT"},
  {sym:"ADA", name:"Cardano",  id:"cardano",  bn:"ADAUSDT"},
  {sym:"ATOM",name:"Cosmos",   id:"cosmos",   bn:"ATOMUSDT"}
];
const STOCKS = [ // sym = Finnhub ticker (prices in USD)
  {sym:"QXO", name:"QXO, Inc."}  // change to your exact ticker
];
const CRYPTO_MS = 30000, STOCK_MS = 60000, FX_MS = 3600000;
// ================================

let cur = "USD", fx = {USD:1,EUR:null,CZK:null};
const data = {}; // sym -> {usd, chg, kind}
let updated = {};

const fmt = (v,c) => v==null ? "—" : new Intl.NumberFormat(c==="CZK"?"cs-CZ":"en-GB",
  {style:"currency",currency:c,maximumFractionDigits:v<1?4:2}).format(v);

function render(){
  renderMine();
  const list = document.getElementById("list");
  const match=a=>(a.sym+" "+a.name).toLowerCase().includes(q);
  const rowHtml=a=>{
    const d = data[a.sym]||{};
    const rate = fx[cur];
    const p = d.usd!=null && rate ? d.usd*rate : null;
    const ch = d.chg;
    const cls = ch==null ? "" : ch>=0 ? "up" : "down";
    return `<div class="row${a.sym===sel?' sel':''}" data-s="${a.sym}" tabindex="0" role="button"><div><div class="sym">${a.sym}</div><div class="name">${a.name}</div></div>
      <div class="price">${fmt(p,cur)}</div>
      <div class="chg ${cls}">${ch==null?"":(ch>=0?"▲ ":"▼ ")+Math.abs(ch).toFixed(2)+"% 24h"}</div></div>`;
  };
  const cats=[["Cryptocurrencies",CRYPTO],["Stocks",STOCKS]]
    .map(([t,arr])=>[t,arr.filter(match)]).filter(([,arr])=>arr.length);
  list.innerHTML = !cats.length ? '<p class="meta">No assets match your search.</p>'
    : cats.map(([t,arr])=>`<h2 class="cat">${t}</h2>`+arr.map(rowHtml).join("")).join("");
  const t = x => x ? new Date(x).toLocaleTimeString() : "…";
  document.getElementById("meta").innerHTML =
    `Crypto: ${t(updated.c)} · Stocks: ${t(updated.s)} · FX (ECB): ${t(updated.f)}` +
    (updated.err ? `<br><span class="err">${updated.err}</span>` : "");
}

async function getJSON(u){const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json();}

async function loadCrypto(){
  try{
    const ids = CRYPTO.map(c=>c.id).join(",");
    const j = await getJSON(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
    CRYPTO.forEach(c=>{ if(j[c.id]) data[c.sym]={usd:j[c.id].usd,chg:j[c.id].usd_24h_change}; });
    updated.c=Date.now(); updated.err=null;
  }catch(e){updated.err="Crypto feed failed ("+e.message+"). Retrying.";}
  render();
}
async function loadStocks(){
  if(FINNHUB_KEY.startsWith("PASTE")){updated.err="Add your Finnhub key in index.html to enable stocks.";render();return;}
  try{
    await Promise.all(STOCKS.map(async s=>{
      const q = await getJSON(`https://finnhub.io/api/v1/quote?symbol=${s.sym}&token=${FINNHUB_KEY}`);
      if(q.c) data[s.sym]={usd:q.c,chg:q.dp};
    }));
    updated.s=Date.now();
  }catch(e){updated.err="Stock feed failed ("+e.message+"). Retrying.";}
  render();
}
async function loadFX(){
  try{
    const j = await getJSON("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,CZK");
    fx.EUR=j.rates.EUR; fx.CZK=j.rates.CZK; updated.f=Date.now(); drawChart();
  }catch(e){updated.err="FX feed failed ("+e.message+"). Retrying.";}
  render();
}

document.querySelectorAll("#cur button").forEach(b=>b.onclick=()=>{
  cur=b.dataset.c;
  document.querySelectorAll("#cur button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  render(); drawChart();
});
document.querySelectorAll("#rng button").forEach(b=>b.onclick=()=>{
  range=b.dataset.r;
  document.querySelectorAll("#rng button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  loadSeries();
});
const pick=e=>{const r=e.target.closest(".row");if(r){sel=r.dataset.s;render();loadSeries();}};
document.getElementById("list").addEventListener("click",pick);
document.getElementById("list").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(e);}});

// ---------- Charts ----------
let sel="BTC", range="1D", series=[], cmsg="", cache={};
const STK_MAP={"1H":{i:"1min",n:60},"1D":{i:"5min",n:78},"1W":{i:"1h",n:35},"1M":{i:"1day",n:22},"1Y":{i:"1day",n:252}};
const BN_MAP={"1H":{i:"1m",n:60},"1D":{i:"5m",n:288},"1W":{i:"1h",n:168},"1M":{i:"4h",n:180},"1Y":{i:"1d",n:365}};
const CB_MAP={"1H":{g:60,n:60},"1D":{g:300,n:288},"1W":{g:3600,n:168},"1M":{g:21600,n:120},"1Y":{g:86400,n:300}};
const CG_DAYS={"1H":1,"1D":1,"1W":7,"1M":30,"1Y":365};

async function fetchSeries(){
  const c=CRYPTO.find(x=>x.sym===sel);
  if(c){
    const b=BN_MAP[range], cb=CB_MAP[range], errs=[];
    const sources=[
      async()=>{const k=await getJSON(`https://data-api.binance.vision/api/v3/klines?symbol=${c.bn}&interval=${b.i}&limit=${b.n}`);
        return k.map(x=>({t:x[0],p:+x[4]}));},
      async()=>{const k=await getJSON(`https://api.exchange.coinbase.com/products/${c.sym}-USD/candles?granularity=${cb.g}`);
        return k.slice(0,cb.n).reverse().map(x=>({t:x[0]*1000,p:+x[4]}));},
      async()=>{const j=await getJSON(`https://api.coingecko.com/api/v3/coins/${c.id}/market_chart?vs_currency=usd&days=${CG_DAYS[range]}`);
        let pts=j.prices.map(([t,p])=>({t,p}));
        if(range==="1H"){const lim=Date.now()-3600000;pts=pts.filter(x=>x.t>=lim);}
        return pts;}
    ];
    for(const [i,f] of sources.entries()){
      try{const pts=await f(); if(pts.length) return pts; errs.push(["Binance","Coinbase","CoinGecko"][i]+": empty");}
      catch(e){errs.push(["Binance","Coinbase","CoinGecko"][i]+": "+e.message);}
    }
    throw new Error("All chart sources failed — "+errs.join(" | "));
  }
  if(TWELVE_KEY.startsWith("PASTE")) throw new Error("Add your Twelve Data key in index.html to show stock charts.");
  const m=STK_MAP[range];
  const j=await getJSON(`https://api.twelvedata.com/time_series?symbol=${sel}&interval=${m.i}&outputsize=${m.n}&apikey=${TWELVE_KEY}`);
  if(!j.values) throw new Error(j.message||"No stock data returned.");
  return j.values.map(v=>({t:new Date(v.datetime.replace(" ","T")).getTime(),p:+v.close})).reverse();
}
async function loadSeries(){
  const key=sel+range, hit=cache[key];
  if(hit&&Date.now()-hit.at<60000){series=hit.pts;cmsg="";return drawChart();}
  series=[];cmsg="Loading chart…";drawChart();
  const mine=key;
  try{
    const pts=await fetchSeries();
    cache[key]={at:Date.now(),pts};
    if(sel+range!==mine)return;
    series=pts;cmsg=pts.length?"":"No data for this range (market may be closed).";
  }catch(e){ if(sel+range!==mine)return; series=[];cmsg=e.message; }
  drawChart();
}
function drawChart(){
  const cv=document.getElementById("cv"), rate=fx[cur];
  document.getElementById("ct").textContent=sel;
  if(!series.length||!rate){cv.innerHTML=`<div class="cmsg">${cmsg||"Loading chart…"}</div>`;
    document.getElementById("cp").textContent="";document.getElementById("cc").textContent="";return;}
  const pts=series.map(x=>({t:x.t,p:x.p*rate}));
  const W=700,H=260,L=8,R=70,T=10,B=26,iw=W-L-R,ih=H-T-B;
  const t0=pts[0].t,t1=pts[pts.length-1].t||t0+1;
  let lo=Math.min(...pts.map(x=>x.p)),hi=Math.max(...pts.map(x=>x.p));
  if(hi===lo){hi+=1;lo-=1;} const pad=(hi-lo)*.08;lo-=pad;hi+=pad;
  const X=t=>L+(t1===t0?0:(t-t0)/(t1-t0)*iw), Y=p=>T+(1-(p-lo)/(hi-lo))*ih;
  const first=pts[0].p,last=pts[pts.length-1].p,up=last>=first;
  const col=up?"var(--up)":"var(--down)";
  const line=pts.map((x,i)=>(i?"L":"M")+X(x.t).toFixed(1)+" "+Y(x.p).toFixed(1)).join("");
  const area=line+`L${X(t1)} ${T+ih}L${X(t0)} ${T+ih}Z`;
  const short=v=>new Intl.NumberFormat(cur==="CZK"?"cs-CZ":"en-GB",{maximumFractionDigits:v<1?4:v<100?2:0}).format(v);
  let grid="";
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
    grid+=`<line x1="${L}" x2="${L+iw}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${W-R+8}" y="${y+4}" font-size="11" fill="var(--mute)">${short(v)}</text>`;}
  const dopt=range==="1Y"||range==="1M"?{day:"numeric",month:"short"}:range==="1W"?{weekday:"short",day:"numeric"}:{hour:"2-digit",minute:"2-digit"};
  let xl="";
  for(let i=0;i<=4;i++){const t=t0+(t1-t0)*i/4;
    xl+=`<text x="${L+iw*i/4}" y="${H-6}" font-size="11" fill="var(--mute)" text-anchor="${i===0?"start":i===4?"end":"middle"}">${new Date(t).toLocaleString("en-GB",dopt)}</text>`;}
  cv.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${sel} price chart, ${range}">
    ${grid}${xl}<path d="${area}" fill="${col}" opacity=".12"/><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <line id="xh" y1="${T}" y2="${T+ih}" stroke="var(--mute)" stroke-dasharray="3 3" visibility="hidden"/>
    <circle id="dot" r="4" fill="${col}" visibility="hidden"/></svg><div class="tip" id="tip" hidden></div>`;
  const ch=(last-first)/first*100, cc=document.getElementById("cc");
  document.getElementById("cp").textContent=fmt(last,cur);
  cc.textContent=(up?"▲ ":"▼ ")+Math.abs(ch).toFixed(2)+"% ("+range+")";cc.className=up?"up":"down";
  const svg=cv.querySelector("svg"),tip=document.getElementById("tip"),xh=document.getElementById("xh"),dot=document.getElementById("dot");
  const show=e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;
    const tt=t0+Math.min(1,Math.max(0,(px-L)/iw))*(t1-t0);
    let best=pts[0];for(const x of pts)if(Math.abs(x.t-tt)<Math.abs(best.t-tt))best=x;
    const cx=X(best.t),cy=Y(best.p);
    xh.setAttribute("x1",cx);xh.setAttribute("x2",cx);xh.setAttribute("visibility","visible");
    dot.setAttribute("cx",cx);dot.setAttribute("cy",cy);dot.setAttribute("visibility","visible");
    tip.hidden=false;tip.style.left=Math.min(Math.max(cx/W*r.width,60),r.width-60)+"px";
    tip.textContent=fmt(best.p,cur)+" · "+new Date(best.t).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  };
  svg.addEventListener("pointermove",show);svg.addEventListener("pointerdown",show);
  svg.addEventListener("pointerleave",()=>{tip.hidden=true;xh.setAttribute("visibility","hidden");dot.setAttribute("visibility","hidden");});
}

// ---------- My assets ----------
let q="";
const readLocal=()=>{try{return JSON.parse(localStorage.getItem("myAssets")||"[]");}catch(e){return[];}};
let mine=readLocal().map((x,i)=>({id:"l"+i,...x}));
const saveMine=()=>{try{localStorage.setItem("myAssets",JSON.stringify(mine));}catch(e){}};
const sb=(window.supabase&&!SB_URL.startsWith("PASTE"))?window.supabase.createClient(SB_URL,SB_KEY):null;
let user=null;
const authMsg=t=>{document.getElementById("amsg").textContent=t||"";};
const cloud=()=>!!(sb&&user);
const allA=()=>[...CRYPTO,...STOCKS];
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtN=n=>new Intl.NumberFormat("en-GB",{maximumFractionDigits:6}).format(n);
function renderMine(){
  const tot=document.getElementById("tot"), al=document.getElementById("alist"), rate=fx[cur];
  if(!mine.length){tot.innerHTML="<small>No assets yet. Press “+ Add” to enter your first holding.</small>";al.innerHTML="";return;}
  let totVal=0, tVal=0, tCost=0;
  al.innerHTML=mine.map((m,i)=>{
    const a=allA().find(x=>x.sym===m.sym), d=a&&data[a.sym], bx=fx[m.ccy];
    const buyUsd=bx?m.buy/bx:null;
    let val=null, pl=null;
    if(a){ if(d&&d.usd!=null){val=m.qty*d.usd; if(buyUsd>0){pl=(d.usd-buyUsd)/buyUsd*100;tVal+=val;tCost+=m.qty*buyUsd;}} }
    else if(buyUsd!=null) val=m.qty*buyUsd;
    if(val!=null) totVal+=val;
    const sub=`${fmtN(m.qty)} × ${fmtN(m.buy)} ${m.ccy}`+(a?"":" · not tracked");
    const right=pl==null?`<small>${a?"loading…":"no live price"}</small>`
      :`<span class="${pl>=0?"up":"down"}">${pl>=0?"▲ +":"▼ "}${pl.toFixed(2)}%</span>`;
    return `<div class="ar"${a?` data-s="${a.sym}"`:""}><div><b>${esc(m.sym)}</b><br><small>${esc(sub)}</small></div>
      <div class="r"><b>${val==null||!rate?"—":fmt(val*rate,cur)}</b><br>${right}</div>
      <button class="del" data-del="${i}" aria-label="Remove ${esc(m.sym)}">✕</button></div>`;
  }).join("");
  const tp=tCost>0?(tVal-tCost)/tCost*100:null;
  tot.innerHTML=`<small>Total value</small><div class="tv">${rate?fmt(totVal*rate,cur):"—"}</div>`+
    (tp==null?"":`<small>Profit on tracked assets: </small><b class="${tp>=0?"up":"down"}">${tp>=0?"▲ +":"▼ "}${tp.toFixed(2)}%</b>`);
}
document.getElementById("syms").innerHTML=allA().map(a=>`<option value="${a.sym}">${a.name}</option>`).join("");
document.getElementById("q").addEventListener("input",e=>{q=e.target.value.toLowerCase().trim();render();});
const addf=document.getElementById("addf");
document.getElementById("addBtn").onclick=()=>{addf.hidden=!addf.hidden;if(!addf.hidden){document.getElementById("fc").value=cur;document.getElementById("fn").focus();}};
document.getElementById("fcancel").onclick=()=>{addf.reset();addf.hidden=true;};
addf.onsubmit=async e=>{
  e.preventDefault();
  const raw=document.getElementById("fn").value.trim(), key=raw.toLowerCase();
  const qty=+document.getElementById("fq").value, buy=+document.getElementById("fb").value;
  if(!raw||!(qty>0)||!(buy>=0))return;
  const a=allA().find(x=>x.sym.toLowerCase()===key||x.name.toLowerCase()===key);
  const item={sym:a?a.sym:raw,qty,buy,ccy:document.getElementById("fc").value};
  authMsg("");
  if(cloud()){
    const {data:r,error}=await sb.from("assets").insert(item).select().single();
    if(error){authMsg("Could not save: "+error.message);return;}
    item.id=r.id;
  }else item.id="l"+Date.now();
  mine.push(item); if(!cloud())saveMine();
  addf.reset();addf.hidden=true;renderMine();
};
document.getElementById("alist").addEventListener("click",async e=>{
  const d=e.target.closest(".del");
  if(d){
    const i=+d.dataset.del, it=mine[i]; if(!it)return;
    if(cloud()){const {error}=await sb.from("assets").delete().eq("id",it.id);
      if(error){authMsg("Could not delete: "+error.message);return;}}
    mine.splice(i,1); if(!cloud())saveMine(); renderMine(); return;
  }
  const r=e.target.closest(".ar[data-s]");
  if(r){sel=r.dataset.s;render();loadSeries();}
});

// ---------- Cloud sync (Supabase) ----------
async function loadMine(){
  if(cloud()){
    const {data:rows,error}=await sb.from("assets").select("*").order("created_at");
    if(error){authMsg("Could not load: "+error.message);return;}
    let list=rows; const loc=readLocal();
    if(!rows.length&&loc.length){ // first login: move this device's assets to the cloud
      const {data:ins,error:e2}=await sb.from("assets").insert(loc.map(({sym,qty,buy,ccy})=>({sym,qty,buy,ccy}))).select();
      if(e2)authMsg("Could not upload local assets: "+e2.message);
      else{list=ins;try{localStorage.removeItem("myAssets");}catch(_){}}
    }
    mine=list.map(r=>({id:r.id,sym:r.sym,qty:+r.qty,buy:+r.buy,ccy:r.ccy}));
  }else mine=readLocal().map((x,i)=>({id:"l"+i,...x}));
  renderMine();
}
function renderAuth(){
  const el=document.getElementById("auth");
  if(!sb){el.innerHTML='<p class="am">Cloud sync is off: assets are saved on this device only.</p>';return;}
  if(user){el.innerHTML=`<p class="am">Synced as <b>${esc(user.email)}</b></p><button class="btn ghost" id="so" type="button" style="margin-bottom:10px">Sign out</button>`;return;}
  el.innerHTML=`<p class="am">Sign in to sync your assets across devices.</p>
    <input id="ae" type="email" placeholder="Email" autocomplete="email">
    <input id="ap" type="password" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div class="two"><button class="btn" id="si" type="button">Sign in</button><button class="btn ghost" id="su" type="button">Create account</button></div>`;
}
document.getElementById("auth").addEventListener("click",async e=>{
  if(!sb)return; const id=e.target.id;
  if(id==="so"){await sb.auth.signOut();return;}
  if(id==="si"||id==="su"){
    const email=document.getElementById("ae").value.trim(), password=document.getElementById("ap").value;
    authMsg("");
    if(!email||password.length<6){authMsg("Enter an email and a password of at least 6 characters.");return;}
    const {data,error}=await (id==="si"?sb.auth.signInWithPassword({email,password}):sb.auth.signUp({email,password}));
    if(error){authMsg(error.message);return;}
    if(id==="su"&&!data.session)authMsg("Account created. Check your email to confirm, then sign in.");
  }
});
async function initAuth(){
  renderAuth(); if(!sb)return;
  const {data}=await sb.auth.getSession(); user=data.session?data.session.user:null;
  renderAuth(); await loadMine();
  sb.auth.onAuthStateChange((_ev,sess)=>{
    const u=sess?sess.user:null;
    if((u&&u.id)!==(user&&user.id)){user=u;authMsg("");renderAuth();loadMine();}
  });
}

render();
loadSeries();
initAuth();
loadFX(); loadCrypto(); loadStocks();
setInterval(loadCrypto,CRYPTO_MS);
setInterval(loadStocks,STOCK_MS);
setInterval(loadFX,FX_MS);
</script>
